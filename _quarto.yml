project:
  type: default
  output-dir: _output
  render:
    - skripsi.qmd

lang: id
bibliography: references.bib
csl: skripsi-ugm.csl

crossref:
  fig-title: "Gambar"
  tbl-title: "Tabel"
  fig-prefix: "Gambar"
  tbl-prefix: "Tabel"
  eq-prefix: "Persamaan"
  fig-labels: arabic
  tbl-labels: arabic

format:
  pdf:
    pdf-engine: xelatex
    documentclass: report
    top-level-division: chapter
    papersize: a4
    fontsize: 12pt
    mainfont: "TeX Gyre Termes"
    linestretch: 1.43
    indent: true
    geometry:
      - top=4cm
      - bottom=3cm
      - left=4cm
      - right=3cm
      - headheight=15pt
    toc: false
    lof: false
    lot: false
    number-sections: true
    number-depth: 3
    code-overflow: wrap
    colorlinks: false
    link-citations: false
    fig-cap-location: bottom
    tbl-cap-location: top
    fig-pos: "htbp"
    include-in-header:
      - meta.tex
      - header.tex
    keep-tex: true
    output-file: skripsi